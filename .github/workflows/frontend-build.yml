name: Frontend build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract frontend source
        run: |
          test -f frontend-source.zip || { echo "::error::Upload frontend-source.zip to this branch"; exit 1; }
          echo 'a6c185c1e66889e7813005764856d1c4a4cb36f3625478d93704ab7e9fcd9ae7  frontend-source.zip' | sha256sum -c -
          mkdir -p frontend-build
          unzip -q frontend-source.zip -d frontend-build
          test -f frontend-build/package.json
      - name: Install and build
        working-directory: frontend-build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build
