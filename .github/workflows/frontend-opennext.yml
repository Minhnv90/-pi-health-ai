name: OpenNext staging build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package staging frontend and validate Worker
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bash scripts/build-frontend-staging.sh
